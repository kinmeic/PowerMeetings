name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: v0.1.0
      release_name:
        description: Release title
        required: false
        default: PowerMeetings v0.1.0
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS app and publish release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app bundles
        run: |
          set -euo pipefail
          for ARCH in arm64 x86_64; do
            ARCH="$ARCH" CONFIGURATION=release Scripts/build_app.sh
          done

      - name: Package app bundles
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          for ARCH in arm64 x86_64; do
            ARCHIVE="PowerMeetings-${TAG}-${ARCH}.zip"
            ditto -c -k --sequesterRsrc --keepParent "dist/${ARCH}/PowerMeetings.app" "$ARCHIVE"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          RELEASE_NAME="${{ inputs.release_name }}"
          if [[ -z "$RELEASE_NAME" ]]; then
            RELEASE_NAME="PowerMeetings ${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PowerMeetings-"$TAG"-arm64.zip PowerMeetings-"$TAG"-x86_64.zip --clobber
          elif [[ "${{ inputs.prerelease }}" == "true" ]]; then
            gh release create "$TAG" PowerMeetings-"$TAG"-arm64.zip PowerMeetings-"$TAG"-x86_64.zip \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Automated macOS build for $TAG." \
              --prerelease
          else
            gh release create "$TAG" PowerMeetings-"$TAG"-arm64.zip PowerMeetings-"$TAG"-x86_64.zip \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Automated macOS build for $TAG."
          fi
