name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        default: v0.1.0
      release_name:
        description: Release title
        required: false
        default: PowerMeetings v0.1.0
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS app and publish release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app bundle
        run: CONFIGURATION=release Scripts/build_app.sh

      - name: Package app bundle
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          ARCHIVE="PowerMeetings-${TAG}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/PowerMeetings.app "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          RELEASE_NAME="${{ inputs.release_name }}"
          if [[ -z "$RELEASE_NAME" ]]; then
            RELEASE_NAME="PowerMeetings ${TAG}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          elif [[ "${{ inputs.prerelease }}" == "true" ]]; then
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Automated macOS build for $TAG." \
              --prerelease
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Automated macOS build for $TAG."
          fi
